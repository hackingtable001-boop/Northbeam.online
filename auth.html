<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — Northbeam</title>
<link id="fav" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%229%22%20fill%3D%22%234f46e5%22%2F%3E%3Cpath%20d%3D%22M9%2023V9l14%2014V9%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<script>try{var A={"ink": ["#0a0a0a", "#f4f4f4"], "indigo": ["#4f46e5", "#818cf8"], "emerald": ["#059669", "#34d399"], "amber": ["#d97706", "#fbbf24"], "rose": ["#e11d48", "#fb7185"], "sky": ["#0284c7", "#38bdf8"]};var s=JSON.parse(localStorage.getItem("nb")||"{}"),d=s.theme==="dark"||(s.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches),a=A[s.acc]||A.indigo,r=document.documentElement;r.dataset.theme=d?"dark":"light";r.style.setProperty("--ac",a[d?1:0])}catch(e){}</script>
<style>
:root{--ac:#4f46e5;--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme=light]{--bg:#fff;--bg2:#f4f4f4;--bg3:#e9e9e9;--fg:#0a0a0a;--mut:#707070;--line:#e4e4e4;--inv:#0a0a0a;--invf:#fff;--sh:0 8px 24px -8px rgba(0,0,0,.18)}
[data-theme=dark]{--bg:#0a0a0a;--bg2:#141414;--bg3:#202020;--fg:#f4f4f4;--mut:#9a9a9a;--line:#262626;--inv:#f4f4f4;--invf:#0a0a0a;--sh:0 8px 24px -8px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Space Grotesk",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;animation:pg .7s var(--ease) both}
@keyframes pg{from{opacity:0}}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.sp2{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.pn{--bg:#000;position:sticky;top:0;align-self:start;height:100vh;background:#000;color:#fff;overflow:hidden}
#dots{position:absolute;inset:0;width:100%;height:100%;display:block}
.lg0{position:absolute;left:48px;top:44px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:-.03em;z-index:2}
.mk{width:34px;height:34px;flex:none}
.qt{position:absolute;left:48px;right:48px;bottom:44px;border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:22px 24px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);z-index:2}
.qt q{display:block;font-size:19px;line-height:1.35;letter-spacing:-.02em;quotes:none}.qt small{display:block;margin-top:12px;opacity:.6;font-size:13px}
.rt{display:flex;flex-direction:column;min-height:100vh;padding:44px 48px 36px}
.top2{display:flex;justify-content:space-between;align-items:center}
.bk{color:var(--mut);transition:.25s}.bk:hover{color:var(--fg);transform:translateX(-3px)}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;transition:.3s var(--ease)}.rb:hover{transform:rotate(180deg);box-shadow:var(--sh)}
.mlg{display:none;align-items:center;gap:10px;font-weight:700;letter-spacing:-.03em}.mlg .mk{width:28px;height:28px;color:var(--fg)}
.fw{width:min(400px,100%);margin:auto;padding:30px 0}
.tb{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:4px}
.tb button{position:relative;z-index:1;border:0;background:none;padding:12px;border-radius:99px;color:var(--mut);transition:color .3s}.tb button.on{color:var(--fg)}
.tb i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--bg);border-radius:99px;box-shadow:var(--sh);transition:transform .45s var(--ease)}
[data-theme=dark] .tb i{background:var(--bg3)}
.tb[data-m=signup] i{transform:translateX(100%)}.tb.hide{display:none}
h1{font-size:36px;line-height:1.05;letter-spacing:-.04em;font-weight:600;margin:40px 0 8px}
.sub{color:var(--mut);margin-bottom:28px}
form{display:grid;gap:18px}
label{display:grid;gap:8px;font-size:14px;font-weight:600}
input[type=text],input[type=email],input[type=password]{width:100%;height:52px;padding:0 18px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:400;outline:0;transition:.25s}
input::placeholder{color:var(--mut);opacity:.8}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}input.bad{border-color:#d33}
.pw{position:relative}.pw input{padding-right:70px}.pw button{position:absolute;right:16px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:13px;font-weight:600;color:var(--mut)}.pw button:hover{color:var(--fg)}
.hint{font-size:13px;color:var(--mut);margin-top:-8px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-top:-6px}.row a:hover{color:var(--ac)}
.chk{display:flex!important;grid-template-columns:none;gap:10px;align-items:flex-start;font-weight:400;font-size:13px;color:var(--mut)}.chk input{margin-top:3px;accent-color:var(--ac)}
.err{color:#d33;font-size:14px;min-height:20px;margin-top:-8px}
.go{height:54px;border-radius:99px;border:0;background:var(--inv);color:var(--invf);font-weight:600;transition:.35s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px}.go:hover{transform:translateY(-3px);box-shadow:var(--sh)}.go[disabled]{opacity:.7;pointer-events:none}
.or{display:flex;align-items:center;gap:14px;color:var(--mut);font-size:13px;margin:6px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:12px}.soc button{height:50px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-weight:500;transition:.3s var(--ease)}.soc button:hover{border-color:var(--ac);transform:translateY(-2px)}
.dm{font-size:12px;color:var(--mut);text-align:center;margin-top:22px}
.ok{display:grid;justify-items:center;text-align:center;gap:14px;padding:40px 0}.ok svg{width:88px;height:88px}.ok circle,.ok path{fill:none;stroke:var(--ac);stroke-dasharray:100;stroke-dashoffset:100;animation:dr .9s var(--ease) forwards}.ok path{animation-delay:.5s}
@keyframes dr{to{stroke-dashoffset:0}}.ok h2{font-size:32px;letter-spacing:-.03em}.ok p{color:var(--mut)}.ok .go{padding:0 32px}
.spin{display:inline-block;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.v{animation:vi .5s var(--ease) both}@keyframes vi{from{opacity:0;transform:translateY(14px)}}
@media(max-width:900px){.sp2{grid-template-columns:1fr}.pn{display:none}.mlg{display:flex}.rt{padding:28px 22px}h1{font-size:32px}}
</style>
</head>
<body>
<div class="sp2">
<aside class="pn"><canvas id="dots"></canvas><a class="lg0" href="index.html"><svg class="mk" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 23V9l14 14V9" stroke="var(--bg)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Northbeam</span></a>
<div class="qt"><q>The calmest tool we have ever adopted. Our team finally stopped switching tabs.</q><small>Amira K. · Product lead, Northwind</small></div></aside>
<main class="rt">
<div class="top2"><a class="bk" href="index.html">← Back to home</a><a class="mlg" href="index.html"><svg class="mk" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 23V9l14 14V9" stroke="var(--bg)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Northbeam</span></a><button class="rb" id="th" aria-label="Toggle theme"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button></div>
<div class="fw"><div class="tb" id="tb" data-m="signup"><i></i><button data-m="login">Log in</button><button data-m="signup">Sign up</button></div><div id="fv"></div></div>
</main></div>
<script>
const $=s=>document.querySelector(s),MAP={"ink": ["#0a0a0a", "#f4f4f4"], "indigo": ["#4f46e5", "#818cf8"], "emerald": ["#059669", "#34d399"], "amber": ["#d97706", "#fbbf24"], "rose": ["#e11d48", "#fb7185"], "sky": ["#0284c7", "#38bdf8"]};
let S={};try{S=JSON.parse(localStorage.getItem("nb")||"{}")}catch(e){}
const saveS=()=>{try{localStorage.setItem("nb",JSON.stringify(S))}catch(e){}};
function theme(){const d=S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches),r=document.documentElement,a=MAP[S.acc]||MAP.indigo;r.dataset.theme=d?"dark":"light";r.style.setProperty("--ac",a[d?1:0])}
$("#th").onclick=()=>{S.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";saveS();theme()};
const CHECK='<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" stroke-width="3" pathLength="100"/><path d="M26 43l11 11 21-23" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/></svg>';
function show(m){if(!["login","signup","forgot"].includes(m))m="login";const su=m==="signup",fg=m==="forgot";
 $("#tb").dataset.m=su?"signup":"login";$("#tb").classList.toggle("hide",fg);$("#tb").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
 document.title=(fg?"Reset password":su?"Sign up":"Log in")+" — Northbeam";try{history.replaceState(null,"","#"+m)}catch(e){}
 $("#fv").innerHTML=`<div class="v"><h1>${fg?"Reset your password":su?"Create your account":"Welcome back"}</h1><p class="sub">${fg?"We will email you a reset link.":su?"Free forever. No card needed.":"Log in to continue to your workspace."}</p>
 <form id="af" data-m="${m}" novalidate>${su?`<label>Name<input type="text" name="nm" autocomplete="name" placeholder="Your name"></label>`:""}
 <label>Email<input type="email" name="em" autocomplete="email" placeholder="you@company.com"></label>
 ${fg?"":`<label>Password<div class="pw"><input type="password" name="pw" autocomplete="${su?"new-password":"current-password"}" placeholder="••••••••"><button type="button" id="pws">Show</button></div></label>`}
 ${su?`<p class="hint">Use at least 6 characters.</p><label class="chk"><input type="checkbox" name="tm"> I agree to the Terms and Privacy Policy</label>`:fg?`<div class="row"><a href="#login" data-go="login">← Back to log in</a></div>`:`<div class="row"><span></span><a href="#forgot" data-go="forgot">Forgot password?</a></div>`}
 <p class="err" id="ae"></p><button class="go" type="submit" id="asub">${fg?"Send reset link":su?"Create account":"Log in"}</button></form>
 ${fg?"":`<div class="or"><span>or continue with</span></div><div class="soc"><button type="button" data-soc="Google">Google</button><button type="button" data-soc="GitHub">GitHub</button></div>`}
 <p class="dm">Demo only: no account is created and your password is never saved or sent anywhere.</p></div>`;
 const f=$("#af");setTimeout(()=>f.elements[su?"nm":"em"].focus(),250)}
function done(name,email,k){try{localStorage.setItem("nbu",JSON.stringify({name,email}))}catch(e){}
 $("#fv").innerHTML=`<div class="v ok">${CHECK}<h2>${k==="signup"?"Account created":"You are in"}</h2><p>Signed in as <b id="aem"></b></p><a class="go" href="index.html">Continue to Northbeam</a></div>`;$("#aem").textContent=email;$("#tb").classList.add("hide")}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();show(g.dataset.go);return}
 const t=e.target.closest("#tb button");if(t){show(t.dataset.m);return}
 const sc=e.target.closest("[data-soc]");if(sc){$("#fv").innerHTML=`<div class="v ok"><i class="spin" style="font-size:54px;font-style:normal">◌</i><h2>Connecting to ${sc.dataset.soc}…</h2></div>`;setTimeout(()=>done("Alex Morgan","alex@example.com","login"),1100);return}
 if(e.target.id==="pws"){const i=e.target.previousElementSibling,h=i.type==="password";i.type=h?"text":"password";e.target.textContent=h?"Hide":"Show"}});
document.addEventListener("input",e=>e.target.classList.remove("bad"));
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,m=f.dataset.m,el=f.elements;let bad=null,msg="";const fail=(x,t)=>{if(!bad){bad=x;msg=t}x.classList.add("bad")};
 if(m==="signup"&&el.nm.value.trim().length<2)fail(el.nm,"Please enter your name.");
 if(!/^\S+@\S+\.\S+$/.test(el.em.value.trim()))fail(el.em,"Enter a valid email address.");
 if(m!=="forgot"&&el.pw.value.length<6)fail(el.pw,"Use at least 6 characters.");
 if(m==="signup"&&!bad&&!el.tm.checked)fail(el.tm,"Please accept the Terms to continue.");
 $("#ae").textContent=msg;if(bad){bad.focus();return}
 const b=$("#asub");b.disabled=true;b.innerHTML='Please wait <i class="spin" style="font-style:normal">◌</i>';const email=el.em.value.trim();
 setTimeout(()=>{if(m==="forgot")$("#fv").innerHTML=`<div class="v ok">${CHECK}<h2>Check your inbox</h2><p>If an account exists, a reset link is on its way (demo).</p><a class="go" href="#login" data-go="login">Back to log in</a></div>`;
  else done(m==="signup"?el.nm.value.trim():email.split("@")[0],email,m)},1200)});
addEventListener("hashchange",()=>show(location.hash.slice(1)));
theme();show(location.hash.slice(1)||"signup");
(function(){const c=$("#dots"),x=c.getContext&&c.getContext("2d");if(!x)return;let W,H,mx=-999,my=-999,t=0;const G=26,mot=S.mot!=="0"&&!matchMedia("(prefers-reduced-motion:reduce)").matches;
 const rs=()=>{const d=Math.min(2,devicePixelRatio||1);W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)};
 function draw(){x.clearRect(0,0,W,H);x.fillStyle="#fff";const cols=Math.ceil(W/G)+1,rows=Math.ceil(H/G)+1;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const px=i*G+G/2,py=j*G+G/2,a=Math.sin(i*.31+t*.6)*Math.sin(j*.27-t*.5),b=Math.sin((i+j)*.22+t*.4),d=Math.hypot(px-mx,py-my);
   let v=Math.max(0,1-Math.abs(a)*3)*.75+Math.max(0,1-Math.abs(b)*4)*.7+Math.max(0,1-d/110)*.9;v=Math.min(1,v);
   x.globalAlpha=.2+.8*v;x.beginPath();x.arc(px,py,1+v*G*.2,0,6.283);x.fill()}x.globalAlpha=1}
 const loop=()=>{t+=.012;draw();requestAnimationFrame(loop)};
 c.parentElement.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});c.parentElement.addEventListener("mouseleave",()=>{mx=my=-999});
 addEventListener("resize",()=>{rs();draw()});rs();draw();if(mot)loop()})();
</script>
</body>
</html>
