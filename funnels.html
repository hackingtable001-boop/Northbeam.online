<style>
:root{--r:12px;--acc:#0a0a0a;--on:#fff;--ease:cubic-bezier(.2,.7,.2,1);--mx:1240px}
[data-theme=light]{--bg:#fff;--bg2:#f6f6f6;--bg3:#ececec;--fg:#0a0a0a;--mut:#6e6e6e;--line:#e6e6e6;--card:#fff;--inv:#0a0a0a;--invf:#fff;--sh:0 24px 60px -20px rgba(0,0,0,.18)}

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.6 "Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:var(--mx);margin:auto;padding:0 5vw}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:28px;padding:14px 5vw;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:-.03em;font-size:20px;display:flex;align-items:center;gap:8px}
.nav{display:flex;gap:2px;flex:1}
.nav button{background:none;border:0;padding:8px 13px;border-radius:99px;color:var(--mut);font-size:15px;transition:.25s}

.tools{display:flex;gap:8px}

.mega.open{max-height:520px;opacity:1}

.btn:hover{transform:translateY(-3px);box-shadow:var(--sh)}.btn:hover i{transform:translateX(4px)}.btn i{font-style:normal;transition:.3s}

.side{border-right:1px solid var(--line);padding:18px;display:grid;gap:6px;align-content:start;font-size:14px;color:var(--mut)}

.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.all{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 28px}

.cl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.cc small{color:var(--mut);font-family:ui-monospace,monospace}.cc h3{margin:8px 0 6px;letter-spacing:-.02em}.cc p{color:var(--mut);font-size:15px}

summary::after{content:"+";font-size:28px;line-height:1;transition:.3s}details[open] summary::after{transform:rotate(45deg)}

.fin{background:var(--inv);color:var(--invf);border-radius:36px;padding:100px 5vw;text-align:center;margin:0 auto 110px;position:relative;overflow:hidden}

.fin>*{position:relative}.fin p{opacity:.6;margin:16px 0 32px}.fin h2{margin:auto}
.nl{display:flex;gap:10px;justify-content:center;margin-top:28px;flex-wrap:wrap}

.ph{padding:80px 0 20px}.crumb{color:var(--mut);font-size:14px;margin-bottom:20px}.crumb a:hover{color:var(--fg)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}

.photo::before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.08) 46px 48px);animation:pan 14s linear infinite}

.rv{opacity:0;transform:translateY(36px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
.noanim *{transition:none!important;animation:none!important}.noanim .rv{opacity:1;transform:none}
.foot{border-top:1px solid var(--line);padding:70px 5vw 30px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:grid;place-items:start center;padding-top:12vh;opacity:0;pointer-events:none;transition:.25s;z-index:90}.modal.open{opacity:1;pointer-events:auto}
.box{width:min(660px,92vw);background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden;transform:scale(.96) translateY(10px);transition:.3s var(--ease);box-shadow:var(--sh)}.modal.open .box{transform:none}
#q{width:100%;padding:22px 24px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font-size:19px;outline:0}
#res{list-style:none;padding:8px;max-height:50vh;overflow:auto}#res li a{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px}#res li a.sel,#res li a:hover{background:var(--bg2)}#res span{color:var(--mut);font-size:13px}
.panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--sh);padding:28px;transform:translateX(105%);transition:.45s var(--ease);z-index:95;display:flex;flex-direction:column;gap:10px}.panel.open{transform:none}
.panel h3{display:flex;justify-content:space-between;align-items:center}.panel label{font-size:13px;color:var(--mut);margin-top:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;padding:3px;gap:3px}.seg button{flex:1;padding:8px;background:none;border:0;border-radius:99px;font-size:14px;transition:.25s}.seg button.on{background:var(--inv);color:var(--invf)}
.sw{display:flex;gap:12px}.sw button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);transition:.25s}.sw button:hover{transform:scale(1.12)}.sw button.on{outline:2px solid var(--fg);outline-offset:3px}
@media(max-width:960px){.nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;padding:12px 5vw;border-bottom:1px solid var(--line)}.nav.open{display:flex}.burger{display:block}.tools span,.tools kbd{display:none}.mi,.all{grid-template-columns:repeat(2,1fr)}.bento,.steps,.tg,.pr,.cl,.f3,.split{grid-template-columns:1fr}.wg{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr 1fr}.app{grid-template-columns:1fr}.side{display:none}.sec{padding:70px 0}.shot{transform:none!important}}

.top{gap:18px;padding:10px 5vw;background:color-mix(in srgb,var(--bg) 94%,transparent)}
.logo{white-space:nowrap;gap:10px;font-size:18px;letter-spacing:-.04em}
.mk{width:28px;height:28px;color:var(--fg);flex:none;transition:transform .7s var(--ease)}.logo:hover .mk{transform:rotate(-10deg) scale(1.1)}
.nav button{padding:6px 11px;font-size:14px;white-space:nowrap}
.ico{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:14px}
.ico kbd{margin:0;font-size:11px;font-family:inherit;padding:1px 5px}
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:var(--fg);transform:scaleX(0);transform-origin:0;z-index:99}

.wd{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .1em}.wd>span{display:inline-block;transform:translateY(115%);animation:up 1.1s var(--ease) forwards;animation-delay:calc(var(--i)*70ms + 250ms)}
@keyframes up{to{transform:none}}.noanim .wd>span{transform:none}
.hero h1.rv,.ph h1.rv{opacity:1;transform:none;filter:none}
.rv{filter:blur(6px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);transition-delay:var(--d,0s)}.rv.in{filter:blur(0)}.noanim .rv{filter:none}
.shot{transform:perspective(1600px) rotateX(var(--rx,12deg)) scale(var(--sc,.94));transition:none}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats div{padding:38px 24px;min-width:0}.stats strong{font-size:clamp(30px,3.4vw,48px);font-variant-numeric:tabular-nums;white-space:nowrap}
.bc,.tc,.cc,.wi{position:relative;overflow:hidden}
.bc::after,.tc::after,.cc::after,.wi::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--fg) 8%,transparent),transparent 60%);opacity:0;transition:opacity .4s}

#include <curl/curl.h>

static size_t sink(char* p, size_t s, size_t n, void* out) {
    static_cast<std::string*>(out)->append(p, s * n);
    return s * n;
}

int main() {
    CURL* c = curl_easy_init();
    std::string resp;
